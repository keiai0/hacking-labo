services:
  # 証明書を生成して /pki(共有ボリューム) に置き、終了する
  pkigen:
    build: ./pkigen
    volumes: ["pki:/pki"]
    networks: [lab]

  # 正規サーバ（CA署名のbank.local証明書）
  legit:
    image: nginx:1.27-bookworm
    hostname: legit
    mem_limit: 128m
    depends_on:
      pkigen: { condition: service_completed_successfully }
    volumes:
      - "pki:/pki:ro"
      - "./srv/legit.conf:/etc/nginx/conf.d/default.conf:ro"
    networks: { lab: { ipv4_address: 10.10.11.20 } }

  # なりすましサーバ（自己署名のbank.local証明書）
  mitm:
    image: nginx:1.27-bookworm
    hostname: mitm
    mem_limit: 128m
    depends_on:
      pkigen: { condition: service_completed_successfully }
    volumes:
      - "pki:/pki:ro"
      - "./srv/mitm.conf:/etc/nginx/conf.d/default.conf:ro"
    networks: { lab: { ipv4_address: 10.10.11.30 } }

  # クライアント（curl/openssl）。/pki から ca.crt を参照できる
  client:
    image: hacklabo/attacker:latest
    hostname: client
    depends_on:
      pkigen: { condition: service_completed_successfully }
    volumes: ["pki:/pki:ro", "./:/work"]
    networks: { lab: { ipv4_address: 10.10.11.10 } }

volumes:
  pki:

networks:
  lab:
    internal: true
    ipam: { config: [{ subnet: 10.10.11.0/24 }] }
