services:
  attacker:
    image: hacklabo/attacker:latest
    hostname: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["../../../captures:/captures", "./:/work"]
    networks: { lab: { ipv4_address: 10.10.1.10 } }

  vuln:
    build: ./vulnerable
    init: true
    hostname: vuln
    mem_limit: 256m
    networks: { lab: { ipv4_address: 10.10.1.20 } }

  fixed:
    build: ./fixed
    init: true
    hostname: fixed
    mem_limit: 256m
    cap_add: [NET_ADMIN]
    networks: { lab: { ipv4_address: 10.10.1.30 } }

  # make capture でラボ内の全通信を記録（スイッチのミラーポート相当）
  capture:
    image: hacklabo/attacker:latest
    profiles: [capture]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["../../../captures:/captures"]
    command: sh -c 'tcpdump -i hl-net01 -U -w /captures/network-01-recon_$$(date +%Y%m%d-%H%M%S).pcap'

networks:
  lab:
    internal: true
    driver_opts: { com.docker.network.bridge.name: hl-net01 }
    ipam: { config: [{ subnet: 10.10.1.0/24 }] }
