services:
  attacker:
    image: hacklabo/attacker:latest
    hostname: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["../../../captures:/captures", "./:/work"]
    networks: { lab: { ipv4_address: 10.10.2.10 } }

  vuln:
    build: ./vulnerable
    init: true
    hostname: vuln
    mem_limit: 256m
    networks: { lab: { ipv4_address: 10.10.2.20 } }

  fixed:
    build: ./fixed
    init: true
    hostname: fixed
    mem_limit: 256m
    networks: { lab: { ipv4_address: 10.10.2.30 } }

  victim:
    build: ./victim
    init: true
    hostname: victim
    mem_limit: 128m
    depends_on: [vuln, fixed]
    networks: { lab: { ipv4_address: 10.10.2.40 } }

  # make capture でラボ内の全通信を記録（スイッチのミラーポート相当）
  capture:
    image: hacklabo/attacker:latest
    profiles: [capture]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["../../../captures:/captures"]
    command: sh -c 'tcpdump -i hl-net02 -U -w /captures/network-02-sniffing_$$(date +%Y%m%d-%H%M%S).pcap'

networks:
  lab:
    internal: true
    driver_opts: { com.docker.network.bridge.name: hl-net02 }
    ipam: { config: [{ subnet: 10.10.2.0/24 }] }
