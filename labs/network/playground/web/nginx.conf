# 公開Web（ディレクトリ一覧ON・バージョン表示・backupが見える）
server {
    listen 80 default_server;
    root /var/www/html;
    autoindex on;
    server_tokens on;
    location /secret/ {
        auth_basic "secret";
        auth_basic_user_file /etc/nginx/.htpasswd;   # HTTP平文のBasic認証
    }
}

# 認証なしの管理画面
server {
    listen 8080;
    root /var/www/admin;
    server_tokens on;
}
