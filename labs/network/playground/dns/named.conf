options {
    directory "/var/cache/bind";
    // 脆弱: 誰からでも再帰問い合わせ・ゾーン転送を許可している
    recursion yes;
    allow-recursion { any; };
    allow-transfer { any; };      // ← AXFRが全開放（設定ミス）
    dnssec-validation no;
    listen-on { any; };
};

zone "corp.local" {
    type master;
    file "/etc/bind/db.corp.local";
};
